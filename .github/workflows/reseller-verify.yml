name: Reseller Verify

on:
  pull_request:
    paths:
      - "app/reseller/**"
      - "app/admin/resellers/**"
      - "app/api/v1/**"
      - "app/store/**"
      - "app/webhook/wickspend/store/**"
      - "app/add-funds/**"
      - "components/BottomNav.tsx"
      - "scripts/reseller-smoke.mjs"
      - "scripts/reseller-subscription-smoke.mjs"
      - "scripts/reseller-wallet-db-regression.sql"
      - "scripts/build-production-aware.sh"
      - "scripts/deploy-production.sh"
      - "scripts/verify-production-runtime.sh"
      - "package.json"
      - ".github/workflows/reseller-verify.yml"
  push:
    branches: [main]
    paths:
      - "app/reseller/**"
      - "app/admin/resellers/**"
      - "app/api/v1/**"
      - "app/store/**"
      - "app/webhook/wickspend/store/**"
      - "app/add-funds/**"
      - "components/BottomNav.tsx"
      - "scripts/reseller-smoke.mjs"
      - "scripts/reseller-subscription-smoke.mjs"
      - "scripts/reseller-wallet-db-regression.sql"
      - "scripts/build-production-aware.sh"
      - "scripts/deploy-production.sh"
      - "scripts/verify-production-runtime.sh"
      - "package.json"
      - ".github/workflows/reseller-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wickspend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wickspend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reseller wallet database regression
        env:
          PGPASSWORD: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d wickspend_test -v ON_ERROR_STOP=1 -f scripts/reseller-wallet-db-regression.sql
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Start application
        run: |
          npm start -- -H 127.0.0.1 -p 3080 > /tmp/wickspend.log 2>&1 &
          echo $! > /tmp/wickspend.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3080/reseller >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wickspend.log
          exit 1
      - name: Reseller smoke tests
        run: node scripts/reseller-smoke.mjs
      - name: Reseller subscription smoke tests
        run: npm run smoke:reseller-subscription
      - name: Application log
        if: failure()
        run: cat /tmp/wickspend.log || true
      - name: Stop application
        if: always()
        run: kill "$(cat /tmp/wickspend.pid)" 2>/dev/null || true
