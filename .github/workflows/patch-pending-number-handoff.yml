name: Apply pending number handoff fix

on:
  push:
    branches:
      - fix/pending-number-handoff
    paths:
      - .github/workflows/patch-pending-number-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/pending-number-handoff
          fetch-depth: 0

      - name: Patch pending number handoff and recovery
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const buyPath = 'app/buy-number/BuyNumberClient.tsx';
          let buy = fs.readFileSync(buyPath, 'utf8');
          const buyMarker = '      const confirmed = result?.ok === true && reference && purchasedNumber && result?.provider_pending !== true;\n\n      if (!confirmed) {';
          if (!buy.includes(buyMarker)) throw new Error('Buy Number pending marker not found');
          const buyReplacement = [
            '      const confirmed = result?.ok === true && reference && purchasedNumber && result?.provider_pending !== true;',
            '',
            '      if (result?.provider_pending === true && reference) {',
            '        const numberContext = JSON.stringify({',
            '          service: selectedService?.name || currentServiceCode(),',
            '          service_code: currentServiceCode(),',
            '          country: selectedCountry?.name || country,',
            '          country_code: country,',
            '        });',
            '        window.sessionStorage.setItem("wickspend:lastNumberReference", reference);',
            '        window.localStorage.setItem("wickspend:lastNumberReference", reference);',
            '        window.sessionStorage.setItem(`wickspend:numberContext:${reference}`, numberContext);',
            '        window.localStorage.setItem(`wickspend:numberContext:${reference}`, numberContext);',
            '        window.location.assign(`/otp?reference=${encodeURIComponent(reference)}`);',
            '        return;',
            '      }',
            '',
            '      if (!confirmed) {'
          ].join('\n');
          buy = buy.replace(buyMarker, buyReplacement);
          fs.writeFileSync(buyPath, buy);

          const otpPath = 'app/otp/page.tsx';
          let otp = fs.readFileSync(otpPath, 'utf8');
          const otpMarker = '          return itemReference && looksLikeNumber && !isTerminal && item?.provider_pending !== true;';
          if (!otp.includes(otpMarker)) throw new Error('OTP pending recovery marker not found');
          otp = otp.replace(otpMarker, '          return itemReference && looksLikeNumber && !isTerminal;');
          fs.writeFileSync(otpPath, otp);
          NODE

      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-pending-number-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buy-number/BuyNumberClient.tsx app/otp/page.tsx .github/workflows/patch-pending-number-handoff.yml
          git commit -m "fix: track pending number purchases"
          git push origin HEAD:fix/pending-number-handoff
