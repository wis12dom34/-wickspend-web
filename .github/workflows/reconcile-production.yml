name: Reconcile Production Snapshot

on:
  push:
    branches:
      - fix/reconcile-production-vps-20260924
    paths:
      - .github/workflows/reconcile-production.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified production source snapshot
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            http://84.247.160.76/reconcile-source-20260924-98b4002d.tar.gz \
            -o /tmp/reconcile.tar.gz
          echo '98b4002d9fe43d9d224af5d0fa617a9de0412267f5a45db75f58b79fcb59b33e  /tmp/reconcile.tar.gz' | sha256sum -c -

      - name: Materialize exact tested source
        run: |
          set -euo pipefail
          tar -xzf /tmp/reconcile.tar.gz
          rm -rf .reconcile
          rm -f .github/workflows/reconcile-production.yml
          git status --short

      - name: Commit reconciled production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(production): materialize verified VPS state'
          git push origin HEAD:fix/reconcile-production-vps-20260924
