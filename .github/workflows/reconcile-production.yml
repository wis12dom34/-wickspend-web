name: Reconcile Production Snapshot

on:
  push:
    branches:
      - reconcile/production-vps-20260924-final
    paths:
      - .github/workflows/reconcile-production.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified production source snapshot
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://wickspend.com/reconcile-source-20260924-29329a17.tar.gz \
            -o /tmp/reconcile.tar.gz
          echo '29329a173f4e09d504a3f42da3b5f98c650dd7add4eca487f8f986157b18a52f  /tmp/reconcile.tar.gz' | sha256sum -c -

      - name: Materialize exact tested source
        run: |
          set -euo pipefail
          tar -xzf /tmp/reconcile.tar.gz
          rm -rf .reconcile
          rm -f .github/workflows/reconcile-production.yml
          git status --short

      - name: Commit reconciled production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(production): reconcile verified VPS state'
          git push origin HEAD:reconcile/production-vps-20260924-final
